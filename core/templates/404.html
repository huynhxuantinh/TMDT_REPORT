<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - Không tìm thấy trang</title>
    <style>
        :root {
            --bg: #f4f8f7;
            --card: #ffffff;
            --ink: #16302b;
            --muted: #55756d;
            --brand: #0f8f72;
            --brand-dark: #0b6f58;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at 15% 15%, #d7f3eb 0%, transparent 35%),
                radial-gradient(circle at 85% 85%, #d5eaf9 0%, transparent 35%),
                var(--bg);
            color: var(--ink);
        }

        .card {
            width: min(680px, 100%);
            background: var(--card);
            border-radius: 20px;
            padding: 30px 28px;
            box-shadow: 0 14px 36px rgba(22, 48, 43, 0.14);
            text-align: center;
        }

        .code {
            margin: 0;
            font-size: clamp(56px, 11vw, 92px);
            line-height: 1;
            letter-spacing: 1px;
            color: var(--brand);
            text-shadow: 0 8px 20px rgba(15, 143, 114, 0.2);
            animation: floatY 2.6s ease-in-out infinite;
        }

        .title {
            margin: 14px 0 10px;
            font-size: clamp(24px, 4vw, 34px);
            line-height: 1.2;
        }

        .desc {
            margin: 0 auto 24px;
            max-width: 560px;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 154px;
            padding: 11px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease;
        }

        .btn-primary {
            background: var(--brand);
            color: #fff;
            box-shadow: 0 10px 20px rgba(15, 143, 114, 0.28);
        }

        .btn-primary:hover {
            background: var(--brand-dark);
            transform: translateY(-2px);
        }

        .btn-soft {
            background: #e6f2ee;
            color: var(--ink);
        }

        .btn-soft:hover {
            transform: translateY(-2px);
        }

        @keyframes floatY {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>
    <main class="card">
        <p class="code">404</p>
        <h1 class="title">Trang bạn tìm không tồn tại</h1>
        <p class="desc">
            Đường dẫn có thể đã thay đổi, đã bị xóa, hoặc bạn đã nhập sai URL.
            Bạn có thể quay về trang chủ để tiếp tục sử dụng hệ thống.
        </p>
        <div class="actions">
            <a class="btn btn-primary" href="/">Về trang chủ</a>
            <a class="btn btn-soft" href="javascript:history.back()">Quay lại</a>
        </div>
    </main>
</body>
</html>
